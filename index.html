<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز العمليات التكتيكية - EMS</title>
    <!-- خط تجوال وزخرفة الأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة المزامنة اللحظية السحابية PubNub -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0e14;
            --panel-bg: rgba(16, 23, 34, 0.95);
            --border-color: rgba(0, 240, 255, 0.25);
            --cyan: #00f0ff;
            --gold: #ffb700;
            --red: #ff3366;
            --green: #00ff88;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شريط التنبيهات والزوار العلوي */
        .top-bar {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .visitor-banner {
            color: var(--gold);
            font-weight: bold;
        }

        /* المكون الرئيسي والتجاوب */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            width: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 900px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        /* بطاقات اللوحة */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .card-title {
            color: var(--cyan);
            font-size: 18px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* بطاقة التقارير الاستثنائية والزخرفة */
        .report-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
            outline: none;
            margin-bottom: 12px;
        }

        .report-textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .tools-btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.3));
            border: 1px solid var(--cyan);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-gold {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.1), rgba(255, 183, 0, 0.3));
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-send {
            background: var(--cyan);
            color: #000;
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 16px;
        }

        /* قائمة التقارير المباشرة */
        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .report-item {
            background: rgba(255, 255, 255, 0.03);
            border-right: 4px solid var(--gold);
            padding: 12px;
            border-radius: 6px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .report-text {
            font-size: 14px;
            line-height: 1.6;
            color: #fff;
            white-space: pre-line;
        }

        /* سجل النشاط المباشر والزوار */
        .activity-log {
            font-size: 12px;
            color: var(--text-muted);
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-entry {
            border-bottom: 1px border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي للتنبيهات والزوار -->
    <div class="top-bar">
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span>اتصال تكتيكي مباشر (Real-Time)</span>
        </div>
        <div class="visitor-banner" id="visitorStatus">
            <i class="fa-solid fa-user-shield"></i> جاري الاتصال بالشبكة...
        </div>
    </div>

    <div class="container">

        <!-- بطاقة التقارير التكتيكية المتقدمة مع المزخرف -->
        <div class="card full-width">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-file-signature"></i> إنشاء تقرير تكتيكي محترف (مزخرف)
                </div>
            </div>

            <textarea id="reportInput" class="report-textarea" placeholder="اكتب تفاصيل التقرير هنا..."></textarea>

            <div class="tools-btn-group">
                <button class="btn btn-gold" onclick="applyDecoration('military')"><i class="fa-solid fa-star"></i> زخرفة عسكرية</button>
                <button class="btn btn-gold" onclick="applyDecoration('brackets')"><i class="fa-solid fa-code"></i> أقواس تكتيكية</button>
                <button class="btn btn-gold" onclick="applyDecoration('clear')"><i class="fa-solid fa-eraser"></i> تنظيف</button>
            </div>

            <button class="btn btn-send" onclick="sendReport()">
                <i class="fa-solid fa-paper-plane"></i> إرسال التقرير للمباشرة الفورية
            </button>
        </div>

        <!-- بطاقة التقارير المباشرة لجميع الزوار -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-list-check"></i> السجل الحي للتقارير
                </div>
            </div>
            <div class="reports-list" id="reportsContainer">
                <div class="report-item" style="border-right-color: var(--cyan);">
                    <div class="report-meta">
                        <span>النظام التكتيكي</span>
                        <span>الآن</span>
                    </div>
                    <div class="report-text">⚡ الشبكة جاهزة لاستقبال ونشر التقارير المباشرة.</div>
                </div>
            </div>
        </div>

        <!-- بطاقة سجل زوار الموقع والنشاط -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-users-viewfinder"></i> سجل دخول الزوار والنشاط
                </div>
            </div>
            <div class="activity-log" id="activityLog">
                <div class="log-entry">🟢 تم الاتصال بالغرفة التكتيكية بنجاح.</div>
            </div>
        </div>

    </div>

    <script>
        // معرف عشوائي آمن للزائر الحالي دون كشف بياناته
        const visitorId = "زائر " + Math.floor(1000 + Math.random() * 9000);
        
        // إعداد شبكة PubNub المجانية المباشرة
        const pubnub = new PubNub({
            publishKey: "demo",
            subscribeKey: "demo",
            userId: visitorId
        });

        const channel = "EMS_TACTICAL_ROOM_2026";

        // الاشتراك في القناة المباشرة
        pubnub.subscribe({ channels: [channel] });

        // استقبال الرسائل والتقارير فوراً من أي شخص ينشر
        pubnub.addListener({
            message: function(event) {
                const data = event.message;
                if (data.type === "REPORT") {
                    addReportToUI(data.author, data.text, data.time);
                } else if (data.type === "JOIN") {
                    addLogEntry(`👤 ${data.author} دخل الموقع الآن.`);
                }
            }
        });

        // الإعلان عن دخول زائر جديد
        setTimeout(() => {
            document.getElementById("visitorStatus").innerHTML = `<i class="fa-solid fa-user-check"></i> أنت متصل كـ: <strong>${visitorId}</strong>`;
            pubnub.publish({
                channel: channel,
                message: { type: "JOIN", author: visitorId }
            });
        }, 1000);

        // وظيفة الزخرفة العسكرية للتقارير
        function applyDecoration(style) {
            const input = document.getElementById("reportInput");
            let text = input.value.trim();
            if (!text) return;

            if (style === 'military') {
                input.value = `╭━━━ [ 📋 تقرير تكتيكي عاجل ] ━━━╮\n\n ◄ ${text}\n\n╰━━━ [ 🎖️ مركز العمليات EMS ] ━━━╯`;
            } else if (style === 'brackets') {
                input.value = `◤◢◤◢ [ بَلاَغ عَمَلِيَاتِي ] ◤◢◤◢\n◀ النص: ${text}\n◤◢◤◢ [ تَمَّ التَّوْثِيقُ ] ◤◢◤◢`;
            } else if (style === 'clear') {
                input.value = text.replace(/[╭━━━╮╰╯◄►◤◢\[\]]/g, '').trim();
            }
        }

        // إرسال التقرير للبث المباشر لكل المتواجدين
        function sendReport() {
            const input = document.getElementById("reportInput");
            const text = input.value.trim();

            if (!text) {
                alert("يرجى كتابة نص التقرير أولاً!");
                return;
            }

            const time = new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' });

            // نشر التقرير سحابياً للجميع
            pubnub.publish({
                channel: channel,
                message: {
                    type: "REPORT",
                    author: visitorId,
                    text: text,
                    time: time
                }
            });

            input.value = "";
        }

        // إضافة التقرير للواجهة
        function addReportToUI(author, text, time) {
            const container = document.getElementById("reportsContainer");
            const item = document.createElement("div");
            item.className = "report-item";
            item.innerHTML = `
                <div class="report-meta">
                    <span><i class="fa-solid fa-user"></i> ${author}</span>
                    <span><i class="fa-regular fa-clock"></i> ${time}</span>
                </div>
                <div class="report-text">${text}</div>
            `;
            container.insertBefore(item, container.firstChild);
        }

        // إضافة سجل النشاط
        function addLogEntry(message) {
            const logContainer = document.getElementById("activityLog");
            const entry = document.createElement("div");
            entry.className = "log-entry";
            entry.innerText = message;
            logContainer.insertBefore(entry, logContainer.firstChild);
        }
    </script>
</body>
</html>
