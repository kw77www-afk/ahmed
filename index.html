<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام التقارير العسكرية</title>
  
  <!-- مكتبة Tailwind CSS للتنسيق -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- مكتبات React و Babel لتشغيل الكود مباشرة بالمتصفح -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090d14;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- المكان الذي سيتم عرض الواجهة فيه -->
  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState } = React;

    // دالة زخرفة التقرير
    const decorateReport = (title, text) => {
      if (!text) return "";
      const header = title || "تقرير عسكري رسمـي";
      return `╭━━━❰ 🎖️ ${header} 🎖️ ❱━━━╮\n\n${text}\n\n╰━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╯`;
    };

    function MilitaryApp() {
      // حالة بطاقة المخالفة الصريحة
      const [violationTitle, setViolationTitle] = useState("تقرير مخالفة صريحة");
      const [violationText, setViolationText] = useState("");
      const [violationAttached, setViolationAttached] = useState(false);

      // حالة بطاقة التقرير العسكري
      const [militaryTitle, setMilitaryTitle] = useState("عنوان التقرير العسكري...");
      const [militaryText, setMilitaryText] = useState("");
      const [militaryAttached, setMilitaryAttached] = useState(false);

      // تنفيذ الزخرفة
      const handleDecorate = (type) => {
        if (type === "violation") {
          setViolationText(prev => decorateReport(violationTitle, prev));
        } else {
          setMilitaryText(prev => decorateReport(militaryTitle, prev));
        }
      };

      // نسخ التقرير
      const copyToClipboard = (text) => {
        if (!text) return;
        navigator.clipboard.writeText(text);
        alert("تم نسخ التقرير بنجاح!");
      };

      return (
        <div className="w-full min-h-screen bg-[#090d14] text-white p-6 flex items-center justify-center relative overflow-x-auto select-none">
          
          {/* خلفية شبكية عسكرية */}
          <div 
            className="absolute inset-0 pointer-events-none opacity-20"
            style={{
              backgroundImage: `radial-gradient(#00f2fe 1px, transparent 1px)`,
              backgroundSize: '24px 24px'
            }}
          />

          <div className="flex items-center gap-12 relative z-10 my-auto py-8">

            {/* 1. بطاقة مخالفة صريحة (اليسار) */}
            <div className="w-[380px] bg-[#0d131d] border border-cyan-500/40 rounded-xl p-4 shadow-[0_0_20px_rgba(0,242,254,0.1)] flex flex-col gap-3 relative">
              
              <div className="flex items-center justify-between border-b border-gray-800 pb-2.5">
                <span className="text-[10px] font-bold text-red-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-800/50 uppercase">
                  violation
                </span>
                <input
                  type="text"
                  value={violationTitle}
                  onChange={(e) => setViolationTitle(e.target.value)}
                  className="bg-transparent text-right font-bold text-sm text-cyan-300 focus:outline-none focus:border-b focus:border-cyan-400 px-1 w-full mr-2"
                  placeholder="عنوان المخالفة..."
                />
                <button 
                  onClick={() => { setViolationText(""); setViolationTitle("تقرير مخالفة صريحة"); }}
                  className="text-gray-500 hover:text-red-400 text-xs px-1"
                >
                  ✕
                </button>
              </div>

              {/* زر الزخرفة */}
              <button
                type="button"
                onClick={() => handleDecorate("violation")}
                className="flex items-center justify-center gap-2 bg-[#142232] hover:bg-[#1a2d42] border border-cyan-500/30 text-cyan-300 text-xs py-1.5 px-3 rounded-lg transition-all active:scale-95"
              >
                <span>✨ زخرفة عسكرية (مثل الصورة)</span>
              </button>

              {/* ورقة الكتابة والشرح */}
              <div className="flex flex-col gap-1">
                <label className="text-[11px] text-gray-400 font-medium">ورقة الشرح والمجريات والأدلة:</label>
                <textarea
                  value={violationText}
                  onChange={(e) => setViolationText(e.target.value)}
                  placeholder="اكتب تفاصيل المخالفة هنا... (مساحة مفتوحة للشرح والمجريات والإثباتات)"
                  rows={8}
                  className="w-full bg-[#06090e] border border-gray-800 rounded-lg p-3 text-xs text-gray-200 focus:border-cyan-500 focus:outline-none resize-none leading-relaxed"
                />
              </div>

              {/* المرفقات */}
              <div className="bg-[#06090e] border border-dashed border-gray-800 rounded-lg py-3 px-2 flex items-center justify-center text-xs text-gray-400">
                {violationAttached ? (
                  <span className="text-emerald-400">✓ تم إرفاق المادة / الدليل</span>
                ) : (
                  <span className="text-gray-500">لم يتم إرفاق إثباتات</span>
                )}
              </div>

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setViolationAttached(!violationAttached)}
                  className="flex-1 bg-[#101d2c] hover:bg-[#172a3f] border border-cyan-500/30 text-cyan-300 text-xs py-2 rounded-lg transition-all"
                >
                  📁 {violationAttached ? "تغيير المرفق" : "رفع / تغيير المرفق"}
                </button>

                <button
                  type="button"
                  onClick={() => copyToClipboard(violationText)}
                  className="bg-[#101d2c] hover:bg-[#172a3f] border border-cyan-500/30 text-cyan-300 px-3 text-xs rounded-lg transition-all"
                >
                  📋
                </button>
              </div>

              {/* نقطة الربط */}
              <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-5 h-5 bg-cyan-400 rounded-full border-4 border-[#090d14] shadow-[0_0_12px_#00f2fe]" />
            </div>


            {/* خط الربط */}
            <div className="w-28 h-[2px] bg-gradient-to-r from-cyan-500/40 via-cyan-400 to-yellow-500/40 relative flex items-center justify-center">
              <div className="w-2.5 h-2.5 bg-cyan-400 rounded-full shadow-[0_0_8px_#00f2fe] animate-pulse" />
            </div>


            {/* 2. بطاقة التقرير العسكري الرئيسي (اليمين) */}
            <div className="w-[400px] bg-[#0d131d] border-2 border-yellow-500/60 rounded-xl p-4 shadow-[0_0_25px_rgba(234,179,8,0.12)] flex flex-col gap-3 relative">
              
              <div className="flex items-center justify-between border-b border-gray-800 pb-2.5">
                <span className="text-[10px] font-bold text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/50 uppercase">
                  military
                </span>
                <input
                  type="text"
                  value={militaryTitle}
                  onChange={(e) => setMilitaryTitle(e.target.value)}
                  className="bg-transparent text-right font-bold text-sm text-yellow-400 focus:outline-none focus:border-b focus:border-yellow-400 px-1 w-full mr-2"
                  placeholder="عنوان التقرير..."
                />
                <button 
                  onClick={() => { setMilitaryText(""); setMilitaryTitle("عنوان التقرير العسكري..."); }}
                  className="text-gray-500 hover:text-red-400 text-xs px-1"
                >
                  ✕
                </button>
              </div>

              {/* زر الزخرفة */}
              <button
                type="button"
                onClick={() => handleDecorate("military")}
                className="flex items-center justify-center gap-2 bg-[#1a1e28] hover:bg-[#252b3a] border border-yellow-500/40 text-yellow-400 text-xs py-1.5 px-3 rounded-lg transition-all active:scale-95"
              >
                <span>✨ زخرفة عسكرية (مثل الصورة)</span>
              </button>

              {/* ورقة الشرح الكامل والمجريات */}
              <div className="flex flex-col gap-1">
                <label className="text-[11px] text-gray-400 font-medium">ورقة الشرح الكامل والمجريات والإثباتات:</label>
                <textarea
                  value={militaryText}
                  onChange={(e) => setMilitaryText(e.target.value)}
                  placeholder="اكتب تفاصيل التقرير العسكري هنا... (ورقة فاضية لشرح الحالة بالكامل مع إمكانية إضافة المجريات والأدلة والإثباتات بالأسفل)"
                  rows={9}
                  className="w-full bg-[#06090e] border border-gray-800 rounded-lg p-3 text-xs text-gray-200 focus:border-yellow-500 focus:outline-none resize-none leading-relaxed"
                />
              </div>

              {/* المرفقات */}
              <div className="bg-[#06090e] border border-dashed border-gray-800 rounded-lg py-3 px-2 flex items-center justify-center text-xs text-gray-400">
                {militaryAttached ? (
                  <span className="text-emerald-400">✓ تم إرفاق الملف العسكري</span>
                ) : (
                  <span className="text-gray-500">لم يتم إرفاق إثباتات</span>
                )}
              </div>

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setMilitaryAttached(!militaryAttached)}
                  className="flex-1 bg-[#181d28] hover:bg-[#222938] border border-yellow-500/30 text-yellow-400 text-xs py-2 rounded-lg transition-all"
                >
                  📁 {militaryAttached ? "تغيير المرفق" : "رفع / تغيير المرفق"}
                </button>

                <button
                  type="button"
                  onClick={() => copyToClipboard(militaryText)}
                  className="bg-[#181d28] hover:bg-[#222938] border border-yellow-500/30 text-yellow-400 px-3 text-xs rounded-lg transition-all"
                >
                  📋
                </button>
              </div>

              {/* نقطة الربط */}
              <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-5 h-5 bg-cyan-400 rounded-full border-4 border-[#090d14] shadow-[0_0_12px_#00f2fe]" />
            </div>

          </div>
        </div>
      );
    }

    // تشغيل التطبيق في الصفحة
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MilitaryApp />);
  </script>
</body>
</html>
