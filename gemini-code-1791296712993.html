<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز العمليات التكتيكية - Outlaw RP | القائد أحمد أيمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #080b11;
            --panel-bg: rgba(13, 19, 31, 0.94);
            --border-color: rgba(0, 240, 255, 0.3);
            --cyan: #00f0ff;
            --gold: #ffb700;
            --red: #ff3366;
            --green: #00ff88;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Tajawal', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 80%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #canvas {
            position: absolute;
            transform-origin: 0 0;
            width: 10000px;
            height: 10000px;
            top: 0;
            left: 0;
        }

        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connection-line {
            stroke: var(--cyan);
            stroke-width: 4px;
            fill: none;
            stroke-dasharray: 8 4;
            animation: dash 20s linear infinite;
            filter: drop-shadow(0 0 8px var(--cyan));
            pointer-events: stroke;
            cursor: pointer;
        }

        .connection-line:hover {
            stroke: var(--red);
            stroke-width: 6px;
            filter: drop-shadow(0 0 12px var(--red));
        }

        @keyframes dash {
            to { stroke-dashoffset: -100; }
        }

        .header {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            height: 60px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 24px;
            color: var(--cyan);
            filter: drop-shadow(0 0 8px var(--cyan));
        }

        .title-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .title-text p {
            font-size: 11px;
            color: var(--cyan);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-gold {
            background: rgba(255, 183, 0, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-gold:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.4);
        }

        .btn-danger {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--red);
            color: var(--red);
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-admin {
            background: rgba(0, 255, 136, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .status-viewer {
            background: rgba(0, 240, 255, 0.15);
            color: var(--cyan);
            border: 1px solid var(--cyan);
        }

        .card {
            position: absolute;
            width: 500px;
            min-height: 450px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
            cursor: move;
        }

        .card-title-input {
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            width: 75%;
            outline: none;
        }

        .card-type-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-textarea {
            width: 100%;
            min-height: 80px;
            height: auto;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            overflow: hidden;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .card-textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .media-container {
            flex: 1;
            width: 100%;
            min-height: 220px;
            background-color: #000;
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .media-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* نقاط التوصيل السهلة والمضيئة */
        .node {
            width: 18px;
            height: 18px;
            background: var(--cyan);
            border: 2px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            box-shadow: 0 0 10px var(--cyan);
            z-index: 30;
            transition: all 0.2s ease;
        }

        .node:hover {
            scale: 1.3;
            background: #fff;
            box-shadow: 0 0 15px var(--cyan);
        }

        .node-active {
            background: var(--gold) !important;
            box-shadow: 0 0 18px var(--gold) !important;
            animation: pulseNode 1s infinite alternate;
        }

        @keyframes pulseNode {
            0% { scale: 1; }
            100% { scale: 1.4; }
        }

        .node-left { left: -9px; }
        .node-right { right: -9px; }

        .resize-handle {
            position: absolute;
            bottom: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            color: var(--cyan);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
        }

        .card-exception {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.15) 0%, rgba(13, 19, 31, 0.95) 100%);
            border: 2px solid var(--gold) !important;
            box-shadow: 0 0 25px rgba(255, 183, 0, 0.25) !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--cyan);
            padding: 25px;
            border-radius: 16px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 30px rgba(0,240,255,0.2);
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            text-align: center;
            font-size: 14px;
        }

        .bottom-toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-group">
            <i class="fa-solid fa-shield-halved logo-icon"></i>
            <div class="title-text">
                <h1>مركز العمليات التكتيكية - Outlaw RP</h1>
                <p>إدارة القيادة العليا | القائد أحمد أيمن</p>
            </div>
        </div>

        <div class="controls-group">
            <div id="statusBadge" class="status-badge status-viewer">
                <i class="fa-solid fa-eye"></i> وضع المعاينة (مباشر للمسؤولين)
            </div>
            <button class="btn" onclick="copyShareLink()">
                <i class="fa-solid fa-share-nodes"></i> نسخ الرابط
            </button>
            <button id="authBtn" class="btn btn-gold" onclick="openAuthModal()">
                <i class="fa-solid fa-key"></i> دخول القائد
            </button>
        </div>
    </header>

    <div id="viewport">
        <div id="canvas">
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <input type="file" id="localFileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelected(event)">

    <div class="bottom-toolbar" id="commanderToolbar" style="display: none;">
        <button class="btn" onclick="addCard('duty')"><i class="fa-solid fa-user-shield"></i> استلام فترة</button>
        <button class="btn" onclick="addCard('violation')"><i class="fa-solid fa-gavel"></i> مخالفة</button>
        <button class="btn" onclick="addCard('evidence')"><i class="fa-solid fa-file-video"></i> إثبات (فيديو/صورة)</button>
        <button class="btn" onclick="addCard('success')"><i class="fa-solid fa-trophy"></i> حالة ناجحة</button>
        <button class="btn btn-gold" onclick="addCard('exception')"><i class="fa-solid fa-crown"></i> أمر استثنائي</button>
        <button class="btn btn-danger" onclick="clearCanvas()"><i class="fa-solid fa-trash"></i> مسح اللوحة</button>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2 style="color: var(--gold); font-size: 18px;"><i class="fa-solid fa-lock"></i> دخول القائد</h2>
            <p style="font-size: 12px; color: var(--text-muted);">أدخل رمز الدخول لتفعيل صلاحيات التحكم</p>
            <input type="password" id="passInput" class="modal-input" placeholder="كلمة المرور (777)">
            <button class="btn btn-gold" style="width: 100%; justify-content: center;" onclick="verifyCommander()">تأكيد وتفعيل</button>
            <button class="btn btn-danger" style="width: 100%; justify-content: center;" onclick="closeAuthModal()">إلغاء</button>
        </div>
    </div>

    <script>
        let db;
        const request = indexedDB.open("TacticalOpsDB", 1);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("mediaStore")) {
                db.createObjectStore("mediaStore");
            }
        };
        request.onsuccess = function(e) {
            db = e.target.result;
            renderBoard();
        };

        let isCommander = false;
        let scale = 1, panX = 0, panY = 0;
        let isPanning = false, startX, startY;
        let cards = [], connections = [];
        let activeNodeData = null; // { cardId, side, el }
        let currentTargetCardId = null;

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');
        const svgLayer = document.getElementById('svg-layer');

        if (localStorage.getItem('commander_authenticated') === 'true') {
            enableCommanderMode();
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target === canvas || e.target === svgLayer) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => isPanning = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 0.05;
            if (e.deltaY < 0) scale = Math.min(scale + zoomFactor, 2);
            else scale = Math.max(scale - zoomFactor, 0.4);
            updateTransform();
        });

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

        function verifyCommander() {
            const pass = document.getElementById('passInput').value;
            if (pass === '777' || pass === 'kw77') {
                localStorage.setItem('commander_authenticated', 'true');
                enableCommanderMode();
                closeAuthModal();
            } else {
                alert('رمز الدخول غير صحيح!');
            }
        }

        function enableCommanderMode() {
            isCommander = true;
            document.getElementById('statusBadge').className = 'status-badge status-admin';
            document.getElementById('statusBadge').innerHTML = '<i class="fa-solid fa-user-check"></i> القائد أحمد أيمن (تحكم كامل)';
            document.getElementById('commanderToolbar').style.display = 'flex';
            document.getElementById('authBtn').style.display = 'none';
            renderBoard();
        }

        function addCard(type, data = null) {
            if (!isCommander && !data) return;

            const cardId = data ? data.id : 'card_' + Date.now();
            const cardObj = data || {
                id: cardId,
                type: type,
                title: getDefaultTitle(type),
                text: '',
                hasMedia: false,
                x: 100 + (cards.length * 40),
                y: 100 + (cards.length * 20),
                width: 500,
                height: 450
            };

            if (!data) cards.push(cardObj);
            renderCard(cardObj);
            saveState();
        }

        function getDefaultTitle(type) {
            switch(type) {
                case 'duty': return 'استلام فترة / مسؤولية';
                case 'violation': return 'تقرير مخالفة صريحة';
                case 'evidence': return 'إثبات تكتيكي (فيديو/صورة)';
                case 'success': return 'حالة قيادية ناجحة';
                case 'exception': return '⚠️ أمر قيادي استثنائي';
                default: return 'بطاقة تكتيكية';
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function renderCard(card) {
            const el = document.createElement('div');
            el.className = `card ${card.type === 'exception' ? 'card-exception' : ''}`;
            el.id = card.id;
            el.style.left = card.x + 'px';
            el.style.top = card.y + 'px';
            el.style.width = card.width + 'px';
            el.style.minHeight = card.height + 'px';

            el.innerHTML = `
                <div class="card-header">
                    <input type="text" class="card-title-input" value="${card.title}" ${!isCommander ? 'readonly' : ''} onchange="updateCardTitle('${card.id}', this.value)">
                    <span class="card-type-tag" style="background: rgba(0,240,255,0.2); color: var(--cyan);">${card.type}</span>
                    ${isCommander ? `<i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--red);" onclick="deleteCard('${card.id}')"></i>` : ''}
                </div>
                <div class="card-body">
                    <textarea class="card-textarea" placeholder="اكتب تفاصيل التقرير كاملة..." ${!isCommander ? 'readonly' : ''} oninput="autoResizeTextarea(this); updateCardText('${card.id}', this.value)">${card.text}</textarea>
                    <div class="media-container" id="media_container_${card.id}">
                        <span style="color:var(--text-muted); font-size:11px;">لم يتم إرفاق إثبات بعد</span>
                    </div>
                    ${isCommander ? `<button class="btn" style="font-size:11px; padding:6px; justify-content:center;" onclick="triggerDirectUpload('${card.id}')"><i class="fa-solid fa-upload"></i> رفع / تغيير الإثبات المباشر</button>` : ''}
                </div>
                <div class="node node-left" onclick="handleNodeClick(event, '${card.id}', 'left')"></div>
                <div class="node node-right" onclick="handleNodeClick(event, '${card.id}', 'right')"></div>
                ${isCommander ? `<div class="resize-handle">◢</div>` : ''}
            `;

            canvas.appendChild(el);
            
            const txt = el.querySelector('.card-textarea');
            if (txt && card.text) autoResizeTextarea(txt);

            makeCardDraggable(el, card);
            if (isCommander) makeCardResizable(el, card);

            loadMediaFromDB(card.id);
        }

        // نظام ربط الخيوط السهل والتفاعلي
        function handleNodeClick(e, cardId, side) {
            e.stopPropagation();
            if (!isCommander) return;

            const nodeEl = e.currentTarget;

            if (!activeNodeData) {
                activeNodeData = { cardId, side, el: nodeEl };
                nodeEl.classList.add('node-active');
            } else {
                if (activeNodeData.cardId !== cardId) {
                    connections.push({
                        from: activeNodeData.cardId,
                        fromSide: activeNodeData.side,
                        to: cardId,
                        toSide: side
                    });
                    drawConnections();
                    saveState();
                }
                activeNodeData.el.classList.remove('node-active');
                activeNodeData = null;
            }
        }

        function triggerDirectUpload(cardId) {
            currentTargetCardId = cardId;
            document.getElementById('localFileInput').click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file || !currentTargetCardId) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const mediaData = e.target.result;
                saveMediaToDB(currentTargetCardId, mediaData);
            };
            reader.readAsDataURL(file);
        }

        function saveMediaToDB(cardId, data) {
            if (!db) return;
            const tx = db.transaction("mediaStore", "readwrite");
            const store = tx.objectStore("mediaStore");
            store.put(data, cardId);
            tx.oncomplete = function() {
                const c = cards.find(x => x.id === cardId);
                if (c) { c.hasMedia = true; saveState(); }
                loadMediaFromDB(cardId);
            };
        }

        function loadMediaFromDB(cardId) {
            if (!db) return;
            const tx = db.transaction("mediaStore", "readonly");
            const store = tx.objectStore("mediaStore");
            const req = store.get(cardId);
            req.onsuccess = function() {
                const container = document.getElementById(`media_container_${cardId}`);
                if (req.result && container) {
                    const isVideo = req.result.startsWith('data:video') || req.result.endsWith('.mp4');
                    container.innerHTML = isVideo ? `<video src="${req.result}" class="media-element" controls></video>` : `<img src="${req.result}" class="media-element">`;
                }
            };
        }

        function makeCardDraggable(el, card) {
            const header = el.querySelector('.card-header');
            let isDragging = false, offX, offY;

            header.addEventListener('mousedown', (e) => {
                if (!isCommander) return;
                isDragging = true;
                offX = (e.clientX / scale) - card.x;
                offY = (e.clientY / scale) - card.y;
                e.stopPropagation();
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    card.x = (e.clientX / scale) - offX;
                    card.y = (e.clientY / scale) - offY;
                    el.style.left = card.x + 'px';
                    el.style.top = card.y + 'px';
                    drawConnections();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    saveState();
                }
            });
        }

        function makeCardResizable(el, card) {
            const handle = el.querySelector('.resize-handle');
            if (!handle) return;
            let isResizing = false, startW, startH, startPageX, startPageY;

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startW = card.width;
                startH = card.height;
                startPageX = e.clientX;
                startPageY = e.clientY;
                e.stopPropagation();
            });

            window.addEventListener('mousemove', (e) => {
                if (isResizing) {
                    const dw = (e.clientX - startPageX) / scale;
                    const dh = (e.clientY - startPageY) / scale;
                    card.width = Math.max(320, startW + dw);
                    card.height = Math.max(280, startH + dh);
                    el.style.width = card.width + 'px';
                    el.style.minHeight = card.height + 'px';
                    drawConnections();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    saveState();
                }
            });
        }

        function drawConnections() {
            svgLayer.innerHTML = '';
            connections.forEach((conn, index) => {
                const c1 = cards.find(c => c.id === conn.from);
                const c2 = cards.find(c => c.id === conn.to);
                
                if (c1 && c2) {
                    const card1El = document.getElementById(c1.id);
                    const card2El = document.getElementById(c2.id);

                    if (!card1El || !card2El) return;

                    const h1 = card1El.offsetHeight;
                    const h2 = card2El.offsetHeight;

                    const x1 = conn.fromSide === 'left' ? c1.x : c1.x + c1.width;
                    const y1 = c1.y + (h1 / 2);

                    const x2 = conn.toSide === 'left' ? c2.x : c2.x + c2.width;
                    const y2 = c2.y + (h2 / 2);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const dx = Math.abs(x2 - x1) / 2 || 50;
                    path.setAttribute('d', `M ${x1} ${y1} C ${x1 + (conn.fromSide === 'left' ? -dx : dx)} ${y1}, ${x2 + (conn.toSide === 'left' ? -dx : dx)} ${y2}, ${x2} ${y2}`);
                    path.setAttribute('class', 'connection-line');

                    if (isCommander) {
                        path.onclick = (e) => {
                            e.stopPropagation();
                            connections.splice(index, 1);
                            drawConnections();
                            saveState();
                        };
                    }
                    svgLayer.appendChild(path);
                }
            });
        }

        function updateCardTitle(id, val) { const c = cards.find(x => x.id === id); if(c){ c.title = val; saveState(); } }
        function updateCardText(id, val) { const c = cards.find(x => x.id === id); if(c){ c.text = val; saveState(); } }

        function deleteCard(id) {
            cards = cards.filter(c => c.id !== id);
            connections = connections.filter(cn => cn.from !== id && cn.to !== id);
            document.getElementById(id)?.remove();
            if (db) {
                const tx = db.transaction("mediaStore", "readwrite");
                tx.objectStore("mediaStore").delete(id);
            }
            drawConnections();
            saveState();
        }

        function clearCanvas() {
            if (confirm('هل أنت تأكد من مسح جميع البطاقات والروابط؟')) {
                cards = [];
                connections = [];
                document.querySelectorAll('.card').forEach(el => el.remove());
                if (db) {
                    const tx = db.transaction("mediaStore", "readwrite");
                    tx.objectStore("mediaStore").clear();
                }
                drawConnections();
                saveState();
            }
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('تم نسخ الرابط الموحد للمسؤولين بنجاح!');
        }

        function saveState() {
            localStorage.setItem('outlaw_tactical_cards', JSON.stringify(cards));
            localStorage.setItem('outlaw_tactical_conns', JSON.stringify(connections));
        }

        function renderBoard() {
            document.querySelectorAll('.card').forEach(el => el.remove());
            const savedCards = localStorage.getItem('outlaw_tactical_cards');
            const savedConns = localStorage.getItem('outlaw_tactical_conns');

            if (savedCards) cards = JSON.parse(savedCards);
            if (savedConns) connections = JSON.parse(savedConns);

            cards.forEach(c => renderCard(c));
            drawConnections();
        }
    </script>
</body>
</html>
